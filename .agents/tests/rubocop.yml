inherit_gem:
  rubocop-rubyfmt:
    - config/full.yml

plugins:
  - "rubocop-rubyfmt"

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  UseCache: false

Layout/IndentationConsistency:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false
